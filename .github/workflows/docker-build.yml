name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      matrix:
        required: true
        type: string
      matrix_manifest:
        required: true
        type: string
      release_tag:
        required: false
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: >
      Build ${{ inputs.component }}
      ${{ matrix.arch }}/${{ matrix.php_version || matrix.nginx_version }}${{ matrix.php_type && '/' }}${{ matrix.php_type || '' }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    runs-on: ${{ matrix.arch == 'amd' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      # one failed combination must not cancel the others; the manifest job only
      # combines images that were built in this run
      fail-fast: false
      max-parallel: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: image
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}
          RELEASE_TAG="${{ inputs.release_tag || env.GITHUB_REF_NAME }}"
          DOCKERFILE=Dockerfile
          FROM_IMAGE=""

          if [ "${{ inputs.component }}" = "php" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-${{ matrix.php_type }}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "php_debug" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-${{ matrix.php_type }}-debug
            FROM_IMAGE=$REGISTRY/${{ matrix.arch }}-php-${{ matrix.php_type }}:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-debug
          elif [ "${{ inputs.component }}" = "php_blackfire" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-fpm-blackfire
            FROM_IMAGE=$REGISTRY/${{ matrix.arch }}-php-fpm:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-blackfire
          elif [ "${{ inputs.component }}" = "supervisord" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-supervisord
            FROM_IMAGE=$REGISTRY/${{ matrix.arch }}-php-cli:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-supervisord
          elif [ "${{ inputs.component }}" = "nginx" ]; then
            IMAGE_NAME=${{ matrix.arch }}-nginx
            IMAGE_TAG=${{ matrix.nginx_version }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-nginx
          fi

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_ref=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "from_image=$FROM_IMAGE" >> "$GITHUB_OUTPUT"

      # The debug/blackfire/supervisord builds also run when single php builds failed. Build
      # them only on a base image whose job succeeded in this run, not on an older one with the
      # same tag (the -LATEST tags).
      - name: Check base image
        if: steps.image.outputs.from_image != ''
        env:
          FROM_IMAGE: ${{ steps.image.outputs.from_image }}
        run: |
          run_id=$(docker buildx imagetools inspect "$FROM_IMAGE" --format '{{json .Image.Config.Labels}}' \
            | jq -r '.["gmbh.cors.pimcore-docker.run-id"] // empty' || true)
          if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
            echo "::error::$FROM_IMAGE was not built in this run (its build failed)"
            exit 1
          fi

      # Pushed by digest only. The tag is set by the last step, so it only ever points to an
      # image whose job succeeded, SBOM check and attestation included; the run-id label tells
      # an image of this run from an older one with the same tag (the -LATEST tags).
      - name: Build and push Docker image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ steps.image.outputs.image_ref }}
          cache-to: type=inline
          labels: gmbh.cors.pimcore-docker.run-id=${{ github.run_id }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version || '' }}
            PHP_TYPE=${{ matrix.php_type || '' }}
            ALPINE_VERSION=${{ matrix.alpine || '' }}
            NGINX_VERSION=${{ matrix.nginx_version || '' }}
            FROM=${{ steps.image.outputs.from_image }}

      # ghcr.io fails intermittently with "unknown blob" when parallel jobs
      # push shared layers; one retry after the race has settled fixes it
      - name: Wait before push retry
        if: steps.build.outcome == 'failure'
        run: sleep 30

      - name: Build and push Docker image (retry)
        id: build-retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ steps.image.outputs.image_ref }}
          cache-to: type=inline
          labels: gmbh.cors.pimcore-docker.run-id=${{ github.run_id }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version || '' }}
            PHP_TYPE=${{ matrix.php_type || '' }}
            ALPINE_VERSION=${{ matrix.alpine || '' }}
            NGINX_VERSION=${{ matrix.nginx_version || '' }}
            FROM=${{ steps.image.outputs.from_image }}

      # Trivy sees PHP, the PECL extensions and composer only through the SBOM inside the image
      # (php/generate-sbom.php) and skips an invalid one silently. Fails before the attestation
      # and the tag if it does not detect the SBOM with the image's PHP version.
      - name: Check SBOM
        if: inputs.component != 'nginx'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }}@${{ steps.build-retry.outputs.digest || steps.build.outputs.digest }}
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          export TRIVY="docker run --rm -v $HOME/.docker:/root/.docker:ro -v $RUNNER_TEMP/trivy-cache:/root/.cache/trivy $TRIVY_IMAGE"
          .github/scripts/check-sbom.sh "$IMAGE"

      # requesting the OIDC token fails now and then ("Failed to get ID token"); one retry
      - name: Generate Artifact Attestation
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build-retry.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true

      - name: Wait before attestation retry
        if: steps.attest.outcome == 'failure'
        run: sleep 30

      - name: Generate Artifact Attestation (retry)
        if: steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build-retry.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true

      - name: Tag image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }}@${{ steps.build-retry.outputs.digest || steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx imagetools create --tag "$IMAGE_REF" "$IMAGE"; then
              exit 0
            fi
            echo "Tagging failed, retrying in $((attempt * 15))s (attempt ${attempt}/3)"
            sleep $((attempt * 15))
          done
          exit 1

  manifest:
    name: >
      Manifest
      ${{ inputs.component }}
      ${{ matrix.php_version || matrix.nginx_version }}${{ matrix.php_type && '/' }}${{ matrix.php_type || '' }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    needs: build
    # also when single builds failed, for every combination whose images were built
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    strategy:
      matrix: ${{ fromJSON(inputs.matrix_manifest) }}
      fail-fast: false
      max-parallel: 2

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}
          RELEASE_TAG="${{ inputs.release_tag || env.GITHUB_REF_NAME }}"

          if [ "${{ inputs.component }}" = "php" ]; then
            IMAGE_NAME=php-${{ matrix.php_type }}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "php_debug" ]; then
            IMAGE_NAME=php-${{ matrix.php_type }}-debug
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "php_blackfire" ]; then
            IMAGE_NAME=php-fpm-blackfire
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "supervisord" ]; then
            IMAGE_NAME=php-supervisord
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "nginx" ]; then
            IMAGE_NAME=nginx
            IMAGE_TAG=${{ matrix.nginx_version }}-${RELEASE_TAG}
          fi

          TARGET=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          AMD=$REGISTRY/amd-$IMAGE_NAME:$IMAGE_TAG
          ARM=$REGISTRY/arm-$IMAGE_NAME:$IMAGE_TAG

          # only combine images whose build succeeded in this run, never one of an earlier run
          # (the -LATEST tags); otherwise this job fails, and "Re-run failed jobs" creates the
          # manifest once the missing build has succeeded
          for image in "$AMD" "$ARM"; do
            run_id=$(docker buildx imagetools inspect "$image" --format '{{json .Image.Config.Labels}}' \
              | jq -r '.["gmbh.cors.pimcore-docker.run-id"] // empty' || true)
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "::error::$image was not built in this run, $TARGET is not updated"
              exit 1
            fi
          done

          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
              --tag "$TARGET" \
              "$AMD" \
              "$ARM"; then
              exit 0
            fi

            sleep_seconds=$((attempt * 15))
            echo "Manifest push failed, retrying in ${sleep_seconds}s (attempt ${attempt}/5)"
            sleep "$sleep_seconds"
          done

          docker buildx imagetools create \
            --tag "$TARGET" \
            "$AMD" \
            "$ARM"