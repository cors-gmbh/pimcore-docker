name: CORS Pimcore Docker Build

on:
  push:
    branches:
      - "10.0"
    tags:
      - "*"
  workflow_dispatch: ~
  schedule:
    - cron: "0 2 * * *"

env:
  ARCHITECTURES: 'amd arm'
  PHP_VERSIONS: '8.4 8.5'
  ALPINE_VERSIONS: '3.23 3.24'
  # both variants of one php/alpine combination are built together in one bake
  # run so they share layers; the variant is only a manifest axis
  VARIANTS: 'pimcore pimcore-slim'
  NGINX_VERSIONS: '1.28 1.29'
  INCOMPATIBLE_MATRIX: >
    []

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php_matrix: ${{ steps.matrix.outputs.php_matrix }}
      php_manifest: ${{ steps.matrix.outputs.php_manifest }}
      nginx_matrix: ${{ steps.matrix.outputs.nginx_matrix }}
      nginx_manifest: ${{ steps.matrix.outputs.nginx_manifest }}
    steps:
      - name: Generate all matrices
        id: matrix
        run: |
          set -e

          IFS=' ' read -r -a ARCH <<< "$ARCHITECTURES"
          IFS=' ' read -r -a PHP <<< "$PHP_VERSIONS"
          IFS=' ' read -r -a ALPINE <<< "$ALPINE_VERSIONS"
          IFS=' ' read -r -a VARIANT <<< "$VARIANTS"
          IFS=' ' read -r -a NGINX <<< "$NGINX_VERSIONS"

          is_incompatible_combination() {
            declare -A combination
            while [[ "$#" -gt 1 ]]; do
              combination["$1"]="$2"
              shift 2
            done

            for row in $(echo "$INCOMPATIBLE_MATRIX" | jq -c '.[]'); do
              local skip=false
              for key in $(echo "$row" | jq -r 'keys[]'); do
                expected_value=$(echo "$row" | jq -r --arg key "$key" '.[$key]')
                if [[ "${combination[$key]}" != "$expected_value" ]]; then
                  skip=true
                  break
                fi
              done
              if [[ "$skip" == "false" ]]; then
                return 0
              fi
            done
            return 1
          }

          emit() {
            local output_var="$1" matrix="$2"
            matrix="{\"include\":[${matrix%,}]}"
            echo "$output_var=$matrix" >> "$GITHUB_OUTPUT"
            echo "::group::$output_var"
            echo "$matrix" | jq .
            echo "::endgroup::"
          }

          php_matrix=""
          php_manifest=""
          for php_version in "${PHP[@]}"; do
            for alpine in "${ALPINE[@]}"; do
              for arch in "${ARCH[@]}"; do
                if is_incompatible_combination php_version "$php_version" alpine "$alpine" arch "$arch"; then continue; fi
                php_matrix+="{\"arch\":\"$arch\",\"php_version\":\"$php_version\",\"alpine\":\"$alpine\"},"
              done
              for variant in "${VARIANT[@]}"; do
                if is_incompatible_combination php_version "$php_version" alpine "$alpine"; then continue; fi
                php_manifest+="{\"variant\":\"$variant\",\"php_version\":\"$php_version\",\"alpine\":\"$alpine\"},"
              done
            done
          done
          emit php_matrix "$php_matrix"
          emit php_manifest "$php_manifest"

          nginx_matrix=""
          nginx_manifest=""
          for nginx_version in "${NGINX[@]}"; do
            for arch in "${ARCH[@]}"; do
              if is_incompatible_combination nginx_version "$nginx_version" arch "$arch"; then continue; fi
              nginx_matrix+="{\"arch\":\"$arch\",\"nginx_version\":\"$nginx_version\"},"
            done
            if is_incompatible_combination nginx_version "$nginx_version"; then continue; fi
            nginx_manifest+="{\"nginx_version\":\"$nginx_version\"},"
          done
          emit nginx_matrix "$nginx_matrix"
          emit nginx_manifest "$nginx_manifest"

  build_php:
    needs: matrix
    uses: ./.github/workflows/docker-build.yml
    with:
      component: php
      matrix: ${{ needs.matrix.outputs.php_matrix }}
      matrix_manifest: ${{ needs.matrix.outputs.php_manifest }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-LATEST', github.ref_name) }}

  build_nginx:
    needs: matrix
    uses: ./.github/workflows/docker-build.yml
    with:
      component: nginx
      matrix: ${{ needs.matrix.outputs.nginx_matrix }}
      matrix_manifest: ${{ needs.matrix.outputs.nginx_manifest }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-LATEST', github.ref_name) }}
