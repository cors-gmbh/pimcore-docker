name: PHP Backport Build

# Builds the PHP base images docker-library no longer publishes for the Alpine versions of
# our older branches, from php-backport/<php>/alpine<alpine>/<type>/ (see php-backport/README.md):
# - 8.1.34 + the PHP security team's backport for CVE-2026-109618 / CVE-2026-109619 (8.1 is EOL)
# - 8.2.35 / 8.3.36 / 8.4.27, the fixed releases, on Alpine 3.21 and 3.22
# Published as ghcr.io/<repo>/php-backport:<php>-<type>-alpine<alpine>; docker-build.yml uses
# them as base for exactly these combinations (keep BACKPORT_COMBOS there in sync).
#
# Pull requests only build and smoke test; pushes to 7.0 and manual runs also publish.

on:
  push:
    branches:
      - "7.0"
    paths:
      - "php-backport/**"
      - ".github/workflows/php-backport.yml"
  pull_request:
    paths:
      - "php-backport/**"
      - ".github/workflows/php-backport.yml"
  workflow_dispatch: ~

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/php-backport

jobs:
  build:
    name: Build php-backport ${{ matrix.combo }}/${{ matrix.php_type }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'amd' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # <php>/<alpine>
        combo: [ "8.1/3.21", "8.2/3.21", "8.3/3.21", "8.3/3.22", "8.4/3.21", "8.4/3.22" ]
        php_type: [ fpm, cli ]
        arch: [ amd, arm ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Resolve Build Directory
        run: |
          COMBO="${{ matrix.combo }}"
          PHP_VERSION=${COMBO%/*}
          ALPINE_VERSION=${COMBO#*/}
          DIR=php-backport/$PHP_VERSION/alpine$ALPINE_VERSION/${{ matrix.php_type }}
          echo "PHP_VERSION=$PHP_VERSION" >> $GITHUB_ENV
          echo "ALPINE_VERSION=$ALPINE_VERSION" >> $GITHUB_ENV
          echo "DIR=$DIR" >> $GITHUB_ENV
          echo "PHP_FULL_VERSION=$(sed -n 's/^ENV PHP_VERSION //p' $DIR/Dockerfile)" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build --tag php-backport:test "$DIR"

      - name: Smoke Test
        run: |
          IMG=php-backport:test
          docker run --rm $IMG php -v
          docker run --rm $IMG php -m
          test "$(docker run --rm $IMG php -r 'echo PHP_VERSION;')" == "$PHP_FULL_VERSION"
          docker run --rm $IMG sh -c "grep -q '^$ALPINE_VERSION\.' /etc/alpine-release"
          # 8.1 only: the marker is set by our Dockerfile, so this fails for an unpatched base
          if grep -q 'PHP_SECURITY_BACKPORT' "$DIR/Dockerfile"; then
            docker run --rm $IMG sh -c 'echo "PHP_SECURITY_BACKPORT=$PHP_SECURITY_BACKPORT"; test -n "$PHP_SECURITY_BACKPORT"'
          fi
          if [ "${{ matrix.php_type }}" == "fpm" ]; then
            docker run --rm $IMG php-fpm -t
          fi

      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_REF=${{ env.IMAGE }}:$PHP_VERSION-${{ matrix.php_type }}-alpine$ALPINE_VERSION-${{ matrix.arch }}
          docker tag php-backport:test "$IMAGE_REF"

          for attempt in 1 2 3 4 5; do
            if docker push "$IMAGE_REF"; then
              exit 0
            fi

            sleep_seconds=$((attempt * 15))
            echo "Docker push failed, retrying in ${sleep_seconds}s (attempt ${attempt}/5)"
            sleep "$sleep_seconds"
          done

          docker push "$IMAGE_REF"

  manifest:
    name: Manifest php-backport ${{ matrix.combo }}/${{ matrix.php_type }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        combo: [ "8.1/3.21", "8.2/3.21", "8.3/3.21", "8.3/3.22", "8.4/3.21", "8.4/3.22" ]
        php_type: [ fpm, cli ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and Push Manifests
        run: |
          COMBO="${{ matrix.combo }}"
          PHP_VERSION=${COMBO%/*}
          ALPINE_VERSION=${COMBO#*/}
          DIR=php-backport/$PHP_VERSION/alpine$ALPINE_VERSION/${{ matrix.php_type }}
          FULL=$(sed -n 's/^ENV PHP_VERSION //p' $DIR/Dockerfile)
          # immutable tag; images with the 8.1 backport carry the CVE in it
          if grep -q 'PHP_SECURITY_BACKPORT' "$DIR/Dockerfile"; then FULL="$FULL-cve-2026-109618"; fi

          SOURCE=${{ env.IMAGE }}:$PHP_VERSION-${{ matrix.php_type }}-alpine$ALPINE_VERSION

          for TAG in \
            $PHP_VERSION-${{ matrix.php_type }}-alpine$ALPINE_VERSION \
            $FULL-${{ matrix.php_type }}-alpine$ALPINE_VERSION; do
            docker manifest rm ${{ env.IMAGE }}:$TAG 2>/dev/null || true
            docker manifest create ${{ env.IMAGE }}:$TAG \
              --amend $SOURCE-amd \
              --amend $SOURCE-arm
            docker manifest push ${{ env.IMAGE }}:$TAG
          done
