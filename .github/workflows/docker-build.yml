name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      matrix:
        required: true
        type: string
      matrix_manifest:
        required: true
        type: string
      release_tag:
        required: false
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: >
      Build ${{ inputs.component }}
      ${{ matrix.arch }}/${{ matrix.php_version || matrix.nginx_version }}${{ matrix.php_type && '/' }}${{ matrix.php_type || '' }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    runs-on: ${{ matrix.arch == 'amd' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      max-parallel: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: image
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}
          RELEASE_TAG="${{ inputs.release_tag || env.GITHUB_REF_NAME }}"
          DOCKERFILE=Dockerfile
          FROM_IMAGE=""

          if [ "${{ inputs.component }}" = "php" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-${{ matrix.php_type }}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "php_debug" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-${{ matrix.php_type }}-debug
            FROM_IMAGE=$REGISTRY/${{ matrix.arch }}-php-${{ matrix.php_type }}:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-debug
          elif [ "${{ inputs.component }}" = "php_blackfire" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-fpm-blackfire
            FROM_IMAGE=$REGISTRY/${{ matrix.arch }}-php-fpm:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-blackfire
          elif [ "${{ inputs.component }}" = "supervisord" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-supervisord
            FROM_IMAGE=$REGISTRY/${{ matrix.arch }}-php-cli:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-supervisord
          elif [ "${{ inputs.component }}" = "nginx" ]; then
            IMAGE_NAME=${{ matrix.arch }}-nginx
            IMAGE_TAG=${{ matrix.nginx_version }}-${RELEASE_TAG}
            DOCKERFILE=Dockerfile-nginx
          fi

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_ref=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "from_image=$FROM_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          cache-from: type=registry,ref=${{ steps.image.outputs.image_ref }}
          cache-to: type=inline
          build-args: |
            PHP_VERSION=${{ matrix.php_version || '' }}
            PHP_TYPE=${{ matrix.php_type || '' }}
            ALPINE_VERSION=${{ matrix.alpine || '' }}
            NGINX_VERSION=${{ matrix.nginx_version || '' }}
            FROM=${{ steps.image.outputs.from_image }}

      # ghcr.io fails intermittently with "unknown blob" when parallel jobs
      # push shared layers; one retry after the race has settled fixes it
      - name: Wait before push retry
        if: steps.build.outcome == 'failure'
        run: sleep 30

      - name: Build and push Docker image (retry)
        id: build-retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          cache-from: type=registry,ref=${{ steps.image.outputs.image_ref }}
          cache-to: type=inline
          build-args: |
            PHP_VERSION=${{ matrix.php_version || '' }}
            PHP_TYPE=${{ matrix.php_type || '' }}
            ALPINE_VERSION=${{ matrix.alpine || '' }}
            NGINX_VERSION=${{ matrix.nginx_version || '' }}
            FROM=${{ steps.image.outputs.from_image }}

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build-retry.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    name: >
      Manifest
      ${{ inputs.component }}
      ${{ matrix.php_version || matrix.nginx_version }}${{ matrix.php_type && '/' }}${{ matrix.php_type || '' }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix: ${{ fromJSON(inputs.matrix_manifest) }}
      max-parallel: 2

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}
          RELEASE_TAG="${{ inputs.release_tag || env.GITHUB_REF_NAME }}"

          if [ "${{ inputs.component }}" = "php" ]; then
            IMAGE_NAME=php-${{ matrix.php_type }}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "php_debug" ]; then
            IMAGE_NAME=php-${{ matrix.php_type }}-debug
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "php_blackfire" ]; then
            IMAGE_NAME=php-fpm-blackfire
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "supervisord" ]; then
            IMAGE_NAME=php-supervisord
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" = "nginx" ]; then
            IMAGE_NAME=nginx
            IMAGE_TAG=${{ matrix.nginx_version }}-${RELEASE_TAG}
          fi

          TARGET=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          AMD=$REGISTRY/amd-$IMAGE_NAME:$IMAGE_TAG
          ARM=$REGISTRY/arm-$IMAGE_NAME:$IMAGE_TAG

          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
              --tag "$TARGET" \
              "$AMD" \
              "$ARM"; then
              exit 0
            fi

            sleep_seconds=$((attempt * 15))
            echo "Manifest push failed, retrying in ${sleep_seconds}s (attempt ${attempt}/5)"
            sleep "$sleep_seconds"
          done

          docker buildx imagetools create \
            --tag "$TARGET" \
            "$AMD" \
            "$ARM"