name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      component:
        description: php (bakes pimcore + pimcore-slim) or nginx
        required: true
        type: string
      matrix:
        required: true
        type: string
      matrix_manifest:
        required: true
        type: string
      release_tag:
        required: false
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: >
      Build ${{ inputs.component }}
      ${{ matrix.arch }}/${{ matrix.php_version || matrix.nginx_version }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    runs-on: ${{ matrix.arch == 'amd' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      max-parallel: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io fails intermittently with "unknown blob" when parallel jobs
      # push shared layers; one retry after the race has settled fixes it

      - name: Bake and push PHP images
        id: bake
        if: inputs.component == 'php'
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          ARCH_PREFIX: ${{ matrix.arch }}-
          PHP_VERSION: ${{ matrix.php_version }}
          ALPINE_VERSION: ${{ matrix.alpine }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          for attempt in 1 2; do
            if docker buildx bake --push --metadata-file bake-metadata.json; then
              break
            fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            echo "bake failed, retrying in 30s"
            sleep 30
          done

          echo "digest_pimcore=$(jq -r '.["pimcore"]["containerimage.digest"]' bake-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "digest_pimcore_slim=$(jq -r '.["pimcore-slim"]["containerimage.digest"]' bake-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Attest pimcore
        if: inputs.component == 'php'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.arch }}-pimcore
          subject-digest: ${{ steps.bake.outputs.digest_pimcore }}
          push-to-registry: true

      - name: Attest pimcore-slim
        if: inputs.component == 'php'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.arch }}-pimcore-slim
          subject-digest: ${{ steps.bake.outputs.digest_pimcore_slim }}
          push-to-registry: true

      - name: Set nginx image metadata
        id: image
        if: inputs.component == 'nginx'
        run: |
          RELEASE_TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "image_name=${{ matrix.arch }}-nginx" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/${{ github.repository }}/${{ matrix.arch }}-nginx:${{ matrix.nginx_version }}-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push nginx image
        id: build
        if: inputs.component == 'nginx'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-nginx
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          cache-from: type=registry,ref=${{ steps.image.outputs.image_ref }}
          cache-to: type=inline
          build-args: |
            NGINX_VERSION=${{ matrix.nginx_version }}

      - name: Wait before push retry
        if: inputs.component == 'nginx' && steps.build.outcome == 'failure'
        run: sleep 30

      - name: Build and push nginx image (retry)
        id: build-retry
        if: inputs.component == 'nginx' && steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-nginx
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          cache-from: type=registry,ref=${{ steps.image.outputs.image_ref }}
          cache-to: type=inline
          build-args: |
            NGINX_VERSION=${{ matrix.nginx_version }}

      - name: Attest nginx
        if: inputs.component == 'nginx'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build-retry.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    name: >
      Manifest
      ${{ matrix.variant || 'nginx' }}
      ${{ matrix.php_version || matrix.nginx_version }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix: ${{ fromJSON(inputs.matrix_manifest) }}
      max-parallel: 2

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}
          RELEASE_TAG="${{ inputs.release_tag || github.ref_name }}"

          if [ "${{ inputs.component }}" = "php" ]; then
            IMAGE_NAME=${{ matrix.variant }}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          else
            IMAGE_NAME=nginx
            IMAGE_TAG=${{ matrix.nginx_version }}-${RELEASE_TAG}
          fi

          TARGET=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          AMD=$REGISTRY/amd-$IMAGE_NAME:$IMAGE_TAG
          ARM=$REGISTRY/arm-$IMAGE_NAME:$IMAGE_TAG

          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create --tag "$TARGET" "$AMD" "$ARM"; then
              exit 0
            fi
            sleep_seconds=$((attempt * 15))
            echo "Manifest push failed, retrying in ${sleep_seconds}s (attempt ${attempt}/5)"
            sleep "$sleep_seconds"
          done

          docker buildx imagetools create --tag "$TARGET" "$AMD" "$ARM"
