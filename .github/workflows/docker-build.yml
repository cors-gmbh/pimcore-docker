name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      matrix:
        required: true
        type: string
      matrix_manifest:
        required: true
        type: string
      release_tag:
        required: false
        type: string # Optional input for specifying a release tag.

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: >
      Build ${{ inputs.component }}
      ${{ matrix.arch }}/${{ matrix.php_version || matrix.nginx_version }}${{ matrix.php_type && '/' }}${{ matrix.php_type || '' }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    runs-on: ${{ matrix.arch == 'amd' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      # one failed combination must not cancel the others; the manifest job only
      # combines images that were built in this run
      fail-fast: false
      max-parallel: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set Image Name and Tag
        id: image_name
        run: |
          FROM_IMAGE=""
          RELEASE_TAG="${{ inputs.release_tag || env.GITHUB_REF_NAME }}"
          
          if [ "${{ inputs.component }}" == "php" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-${{ matrix.php_type }}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "php_debug" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-${{ matrix.php_type }}-debug
            FROM_IMAGE=ghcr.io/${{ github.repository }}/${{ matrix.arch }}-php-${{ matrix.php_type }}:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "php_blackfire" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-fpm-blackfire
            FROM_IMAGE=ghcr.io/${{ github.repository }}/${{ matrix.arch }}-php-fpm:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "supervisord" ]; then
            IMAGE_NAME=${{ matrix.arch }}-php-supervisord
            FROM_IMAGE=ghcr.io/${{ github.repository }}/${{ matrix.arch }}-php-cli:${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "nginx" ]; then
            IMAGE_NAME=${{ matrix.arch }}-nginx
            IMAGE_TAG=${{ matrix.nginx_version }}-${RELEASE_TAG}
          fi
          
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "FROM_IMAGE=$FROM_IMAGE" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # The debug/blackfire/supervisord builds also run when single php builds failed. Build
      # them only on a base image pushed by this run, not on an older one with the same tag
      # (the -LATEST tags).
      - name: Check base image
        if: env.FROM_IMAGE != ''
        run: |
          run_id=$(docker buildx imagetools inspect "$FROM_IMAGE" --format '{{json .Image.Config.Labels}}' \
            | jq -r '.["gmbh.cors.pimcore-docker.run-id"] // empty' || true)
          if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
            echo "::error::$FROM_IMAGE was not built in this run (its build failed)"
            exit 1
          fi

      - name: Pull Latest Image for Cache
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}
          docker pull $REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }} || echo "No cache available"

      - name: Build Docker Image
        id: build
        run: |
          DOCKERFILE=Dockerfile

          if [ "${{ inputs.component }}" == "php_debug" ]; then
            DOCKERFILE=Dockerfile-debug
          elif [ "${{ inputs.component }}" == "php_blackfire" ]; then
            DOCKERFILE=Dockerfile-blackfire
          elif [ "${{ inputs.component }}" == "supervisord" ]; then
            DOCKERFILE=Dockerfile-supervisord
          elif [ "${{ inputs.component }}" == "nginx" ]; then
            DOCKERFILE=Dockerfile-nginx
          fi

          REGISTRY=ghcr.io/${{ github.repository }}

          # docker-library no longer publishes these PHP/Alpine combinations, so the official
          # images stay on PHP versions without the CVE-2026-109618/-109619 fix. Build from our
          # own php-backport images instead (php-backport.yml). Only combinations 7.0 builds;
          # php-backport.yml also builds some for branch 8.0.
          BACKPORT_COMBOS="8.1/3.21 8.2/3.21 8.3/3.21 8.3/3.22 8.4/3.21 8.4/3.22"
          PHP_BASE_IMAGE=php
          if [ "${{ inputs.component }}" == "php" ] && [[ " $BACKPORT_COMBOS " == *" ${{ matrix.php_version }}/${{ matrix.alpine }} "* ]]; then
            PHP_BASE_IMAGE=$REGISTRY/php-backport
          fi

          docker build \
            -f $DOCKERFILE \
            --cache-from $REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }} \
            --tag $REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }} \
            --label gmbh.cors.pimcore-docker.run-id=${{ github.run_id }} \
            --build-arg PHP_BASE_IMAGE=$PHP_BASE_IMAGE \
            --build-arg PHP_VERSION=${{ matrix.php_version || '' }} \
            $(if [ -n "${{ env.FROM_IMAGE }}" ]; then echo "--build-arg FROM=${{ env.FROM_IMAGE }}"; fi) \
            --build-arg PHP_TYPE=${{ matrix.php_type || '' }} \
            --build-arg ALPINE_VERSION=${{ matrix.alpine || '' }} \
            --build-arg NGINX_VERSION=${{ matrix.nginx_version || '' }} .

      # Trivy sees PHP, the PECL extensions and composer only through the SBOM inside the image
      # (php/generate-sbom.php) and skips an invalid one silently. Fails before the push if it
      # does not detect the SBOM with the image's PHP version.
      - name: Check SBOM
        if: inputs.component != 'nginx'
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          export TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $RUNNER_TEMP/trivy-cache:/root/.cache/trivy $TRIVY_IMAGE"
          .github/scripts/check-sbom.sh "ghcr.io/${{ github.repository }}/$IMAGE_NAME:${{ env.IMAGE_TAG }}"

      - name: Push Docker Image
        id: push
        run: |
          IMAGE_REF=ghcr.io/${{ github.repository }}/$IMAGE_NAME:${{ env.IMAGE_TAG }}
          
          for attempt in 1 2 3 4 5; do
            if docker push "$IMAGE_REF"; then
              exit 0
            fi
          
            sleep_seconds=$((attempt * 15))
            echo "Docker push failed, retrying in ${sleep_seconds}s (attempt ${attempt}/5)"
            sleep "$sleep_seconds"
          done
          
          docker push "$IMAGE_REF"

      - name: Get Image Digest
        id: get_digest
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }} | cut -d '@' -f 2)
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE_DIGEST=$DIGEST" # Output to logs for debugging

      # requesting the OIDC token fails now and then ("Failed to get ID token"); one retry
      - name: Generate Artifact Attestation
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Wait before attestation retry
        if: steps.attest.outcome == 'failure'
        run: sleep 30

      - name: Generate Artifact Attestation (retry)
        if: steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

  manifest:
    name:
      Manifest
      ${{ inputs.component }}
      ${{ matrix.php_version || matrix.nginx_version }}${{ matrix.php_type && '/' }}${{ matrix.php_type || '' }}${{ matrix.alpine && '/' }}${{ matrix.alpine || '' }}
    needs: build
    # also when single builds failed, for every combination whose images were built
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    strategy:
      matrix: ${{ fromJSON(inputs.matrix_manifest) }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and Push Multi-Arch Manifest
        run: |
          REGISTRY=ghcr.io/${{ github.repository }}

          RELEASE_TAG="${{ inputs.release_tag || env.GITHUB_REF_NAME }}"

          if [ "${{ inputs.component }}" == "php" ]; then
            IMAGE_NAME=php-${{ matrix.php_type }}
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "php_debug" ]; then
            IMAGE_NAME=php-${{ matrix.php_type }}-debug
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "php_blackfire" ]; then
            IMAGE_NAME=php-fpm-blackfire
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "supervisord" ]; then
            IMAGE_NAME=php-supervisord
            IMAGE_TAG=${{ matrix.php_version }}-alpine${{ matrix.alpine }}-${RELEASE_TAG}
          elif [ "${{ inputs.component }}" == "nginx" ]; then
            IMAGE_NAME=nginx
            IMAGE_TAG=${{ matrix.nginx_version }}-${RELEASE_TAG}
          fi

          # only combine images built in this run, never one of an earlier run (the -LATEST
          # tags); otherwise this job fails, and "Re-run failed jobs" creates the manifest once
          # the missing build has succeeded
          for image in "$REGISTRY/amd-$IMAGE_NAME:$IMAGE_TAG" "$REGISTRY/arm-$IMAGE_NAME:$IMAGE_TAG"; do
            run_id=$(docker buildx imagetools inspect "$image" --format '{{json .Image.Config.Labels}}' \
              | jq -r '.["gmbh.cors.pimcore-docker.run-id"] // empty' || true)
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "::error::$image was not built in this run, $REGISTRY/$IMAGE_NAME:$IMAGE_TAG is not updated"
              exit 1
            fi
          done

          docker manifest create \
            $REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            --amend $REGISTRY/amd-$IMAGE_NAME:$IMAGE_TAG \
            --amend $REGISTRY/arm-$IMAGE_NAME:$IMAGE_TAG
          
          MANIFEST_REF=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG
  
          for attempt in 1 2 3 4 5; do
            if docker manifest push "$MANIFEST_REF"; then
              exit 0
            fi
        
            sleep_seconds=$((attempt * 15))
            echo "Docker manifest push failed, retrying in ${sleep_seconds}s (attempt ${attempt}/5)"
            sleep "$sleep_seconds"
          done
          
          docker manifest push "$MANIFEST_REF"