stages:
  - prepare
  - test

variables:
  TEST_PHPSTAN: "false"
  TEST_LINT_TWIG: "true"
  TEST_LINT_YAML: "true"
  TEST_LINT_CONTAINER: "true"
  TEST_PSALM: "true"
  TEST_IMAGE: ghcr.io/cors-gmbh/pimcore-docker/php-cli

read_env:
  stage: prepare
  image: alpine:latest
  script:
    - grep -E '^DOCKER_' .env > docker.env
  artifacts:
    reports:
      dotenv: docker.env
  tags:
    - cors

test:
  stage: test
  needs:
    - job: read_env
      artifacts: true
  image: $TEST_IMAGE:$DOCKER_PHP_VERSION-alpine$DOCKER_ALPINE_VERSION-$DOCKER_BASE_IMAGE
  variables:
    DATABASE_HOST: ""
    DATABASE_PORT: ""
    DATABASE_USER: ""
    DATABASE_PASSWORD: ""
    DATABASE_NAME: ""
    DATABASE_VERSION: "8.0.26"
  cache:
    paths:
      - vendor/
  before_script:
    - composer install
  script:
    - vendor/bin/ecs check src
    - if [ "$TEST_LINT_TWIG" = "true" ] ; then bin/console lint:twig templates; fi
    - if [ "$TEST_LINT_YAML" = "true" ] ; then bin/console lint:yaml config; fi
    - if [ "$TEST_LINT_CONTAINER" = "true" ] ; then bin/console lint:container; fi
    - if [ "$TEST_PHPSTAN" = "true" ] ; then vendor/bin/phpstan analyse src; fi
    - if [ "$TEST_PSALM" = "true" ] ; then vendor/bin/psalm src; fi
  tags:
    - cors
