name: CORS Pimcore Docker Build

on:
  push:
    branches:
      - "8.0"
    tags:
      - "*"
  workflow_dispatch: ~
  schedule:
    - cron: "0 2 * * *"

env:
  ARCHITECTURES: 'amd arm'
  PHP_VERSIONS: '8.2 8.3 8.4 8.5'
  PHP_TYPES: 'fpm cli'
  ALPINE_VERSIONS: '3.21 3.22 3.23'
  NGINX_VERSIONS: '1.26 1.27 1.28 1.29'
  INCOMPATIBLE_MATRIX: >
    [
      { "php_version": "8.2", "alpine": "3.22" },
      { "php_version": "8.2", "alpine": "3.23" },
    ]

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php_matrix: ${{ steps.matrix.outputs.php_matrix }}
      php_manifest: ${{ steps.matrix.outputs.php_manifest }}
      php_debug_matrix: ${{ steps.matrix.outputs.php_debug_matrix }}
      php_debug_manifest: ${{ steps.matrix.outputs.php_debug_manifest }}
      php_blackfire_matrix: ${{ steps.matrix.outputs.php_blackfire_matrix }}
      php_blackfire_manifest: ${{ steps.matrix.outputs.php_blackfire_manifest }}
      supervisord_matrix: ${{ steps.matrix.outputs.supervisord_matrix }}
      supervisord_manifest: ${{ steps.matrix.outputs.supervisord_manifest }}
      nginx_matrix: ${{ steps.matrix.outputs.nginx_matrix }}
      nginx_manifest: ${{ steps.matrix.outputs.nginx_manifest }}
    steps:
      - name: Generate all matrices
        id: matrix
        run: |
          set -e

          ########################
          ## Parse env variables into arrays
          ########################

          IFS=' ' read -r -a ARCH <<< "$ARCHITECTURES"
          IFS=' ' read -r -a PHP <<< "$PHP_VERSIONS"
          IFS=' ' read -r -a TYPES <<< "$PHP_TYPES"
          IFS=' ' read -r -a ALPINE <<< "$ALPINE_VERSIONS"
          IFS=' ' read -r -a NGINX <<< "$NGINX_VERSIONS"

          ########################
          ## Incompatibility Check Function
          ########################

          is_incompatible_combination() {
            declare -A combination
            while [[ "$#" -gt 1 ]]; do
              key="$1"
              value="$2"
              combination["$key"]="$value"
              shift 2
            done

            for row in $(echo "$INCOMPATIBLE_MATRIX" | jq -c '.[]'); do
              local skip=false
              for key in $(echo "$row" | jq -r 'keys[]'); do
                expected_value=$(echo "$row" | jq -r --arg key "$key" '.[$key]')
                if [[ "${combination[$key]}" != "$expected_value" ]]; then
                  skip=true
                  break
                fi
              done
              if [[ "$skip" == "false" ]]; then
                return 0
              fi
            done
            return 1
          }

          ########################
          ## Matrix Generator Function
          ########################

          generate_matrix() {
            local component="$1"
            local output_var="$2"
            local build_axes="$3"

            local matrix='{"include":['

            if [[ "$component" == "php" || "$component" == "php_debug" ]]; then
              for php_version in "${PHP[@]}"; do
                for php_type in "${TYPES[@]}"; do
                  for alpine in "${ALPINE[@]}"; do
                    if [[ "$component" == "php_debug" && "$php_type" != "fpm" ]]; then continue; fi
                    if [[ "$build_axes" == "build" ]]; then
                      for arch in "${ARCH[@]}"; do
                        if is_incompatible_combination php_version "$php_version" php_type "$php_type" alpine "$alpine" arch "$arch"; then continue; fi
                        matrix+="{\"arch\":\"$arch\",\"php_version\":\"$php_version\",\"php_type\":\"$php_type\",\"alpine\":\"$alpine\"},"
                      done
                    else
                      if is_incompatible_combination php_version "$php_version" php_type "$php_type" alpine "$alpine"; then continue; fi
                      matrix+="{\"php_version\":\"$php_version\",\"php_type\":\"$php_type\",\"alpine\":\"$alpine\"},"
                    fi
                  done
                done
              done

            elif [[ "$component" == "php_blackfire" || "$component" == "supervisord" ]]; then
              for php_version in "${PHP[@]}"; do
                for alpine in "${ALPINE[@]}"; do
                  if [[ "$build_axes" == "build" ]]; then
                    for arch in "${ARCH[@]}"; do
                      if is_incompatible_combination php_version "$php_version" alpine "$alpine" arch "$arch"; then continue; fi
                      matrix+="{\"arch\":\"$arch\",\"php_version\":\"$php_version\",\"alpine\":\"$alpine\"},"
                    done
                  else
                    if is_incompatible_combination php_version "$php_version" alpine "$alpine"; then continue; fi
                    matrix+="{\"php_version\":\"$php_version\",\"alpine\":\"$alpine\"},"
                  fi
                done
              done

            elif [[ "$component" == "nginx" ]]; then
              for nginx_version in "${NGINX[@]}"; do
                if [[ "$build_axes" == "build" ]]; then
                  for arch in "${ARCH[@]}"; do
                    if is_incompatible_combination nginx_version "$nginx_version" arch "$arch"; then continue; fi
                    matrix+="{\"arch\":\"$arch\",\"nginx_version\":\"$nginx_version\"},"
                  done
                else
                  if is_incompatible_combination nginx_version "$nginx_version"; then continue; fi
                  matrix+="{\"nginx_version\":\"$nginx_version\"},"
                fi
              done
            fi

            matrix="${matrix%,}]}"
            echo "$output_var=$matrix" >> $GITHUB_OUTPUT

            echo "::group::Generated matrix for $component ($output_var)"
            echo "$matrix" | jq .
            echo "::endgroup::"
          }

          ########################
          ## Build for all components
          ########################

          for component in php php_debug php_blackfire supervisord nginx; do
            generate_matrix "$component" "${component//-/_}_matrix" "build"
            generate_matrix "$component" "${component//-/_}_manifest" "manifest"
          done

  build_php:
    needs: matrix
    uses: ./.github/workflows/docker-build.yml
    with:
      component: php
      matrix: ${{ needs.matrix.outputs.php_matrix }}
      matrix_manifest: ${{ needs.matrix.outputs.php_manifest }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-LATEST', github.ref_name) }}

  build_php_debug:
    needs: [ build_php, matrix ]
    uses: ./.github/workflows/docker-build.yml
    with:
      component: php_debug
      matrix: ${{ needs.matrix.outputs.php_debug_matrix }}
      matrix_manifest: ${{ needs.matrix.outputs.php_debug_manifest }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-LATEST', github.ref_name) }}

  build_php_blackfire:
    needs: [ build_php, matrix ]
    uses: ./.github/workflows/docker-build.yml
    with:
      component: php_blackfire
      matrix: ${{ needs.matrix.outputs.php_blackfire_matrix }}
      matrix_manifest: ${{ needs.matrix.outputs.php_blackfire_manifest }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-LATEST', github.ref_name) }}

  build_supervisord:
    needs: [ build_php, matrix ]
    uses: ./.github/workflows/docker-build.yml
    with:
      component: supervisord
      matrix: ${{ needs.matrix.outputs.supervisord_matrix }}
      matrix_manifest: ${{ needs.matrix.outputs.supervisord_manifest }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-LATEST', github.ref_name) }}

  build_nginx:
    needs: matrix
    uses: ./.github/workflows/docker-build.yml
    with:
      component: nginx
      matrix: ${{ needs.matrix.outputs.nginx_matrix }}
      matrix_manifest: ${{ needs.matrix.outputs.nginx_manifest }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-LATEST', github.ref_name) }}